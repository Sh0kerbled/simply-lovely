{% extends 'base.html' %} {% block title %}404 — Simply Lovely{% endblock %} {%block content %}
<div
  class="min-h-screen flex items-center justify-center px-4"
  style="background: linear-gradient(to bottom, var(--bg-subtle), var(--bg))"
>
  <div class="text-center">
    <p
      class="text-8xl font-bold tracking-tighter mb-4"
      style="color: var(--border)"
    >
      404
    </p>

    <h1 class="text-2xl font-bold tracking-tight theme-text mb-3">
      Page not found
    </h1>
    <p class="text-sm theme-muted mb-8 max-w-xs mx-auto">
      The page you're looking for doesn't exist or has been moved.
    </p>

    <a
      href="/"
      class="inline-flex items-center gap-2 px-6 py-2.5 rounded-lg text-sm font-medium transition-opacity"
      style="background: var(--text); color: var(--bg)"
      onmouseover="this.style.opacity = '.88'"
      onmouseout="this.style.opacity = '1'"
    >
      <svg
        class="w-4 h-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M19 12H5" />
        <path d="m12 19-7-7 7-7" />
      </svg>
      Back to home
    </a>
  </div>
</div>
{% endblock %}
