{%extends 'base.html'%} {%block content%}
<div class="min-h-screen bg-gradient-to-b from-gray-100 to-white py-20 px-4">
  <div class="max-w-2xl mx-auto">
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold tracking-tight text-gray-900 mb-3">
        Become a Seller
      </h1>
      <p class="text-gray-500 text-lg">
        Join our community and start selling your products today
      </p>
    </div>

    <div class="bg-white border border-gray-200 rounded-lg p-8 shadow-sm">
      <form>
        <h2 class="text-xl font-semibold text-gray-900 mb-6">
          Personal Information
        </h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >First Name</label
            >
            <input
              type="text"
              placeholder="John"
              class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 transition"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Last Name</label
            >
            <input
              type="text"
              placeholder="Doe"
              class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 transition"
            />
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            placeholder="john@example.com"
            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 transition"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-8">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Password</label
            >
            <input
              type="password"
              placeholder="••••••••"
              class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 transition"
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1"
              >Confirm Password</label
            >
            <input
              type="password"
              placeholder="••••••••"
              class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 transition"
            />
          </div>
        </div>

        <hr class="border-gray-200 mb-8" />

        <h2 class="text-xl font-semibold text-gray-900 mb-6">
          Store Information
        </h2>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1"
            >Store Name</label
          >
          <input
            type="text"
            placeholder="My Lovely Store"
            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900 transition"
          />
        </div>

        <hr class="border-gray-200 mb-8" />

        <div class="flex items-start gap-3 mb-8">
          <input
            type="checkbox"
            id="agree"
            class="mt-0.5 w-4 h-4 accent-gray-900 cursor-pointer"
          />
          <label for="agree" class="text-sm text-gray-500 leading-relaxed">
            I agree to the
            <a
              href="#"
              class="text-gray-900 font-medium underline hover:opacity-70 transition"
              >Terms of Service</a
            >
            and
            <a
              href="#"
              class="text-gray-900 font-medium underline hover:opacity-70 transition"
              >Privacy Policy</a
            >
          </label>
        </div>

        <button
          type="submit"
          class="w-full bg-gray-900 text-white py-3 rounded-lg hover:opacity-90 transition-opacity font-medium inline-flex items-center justify-center space-x-2"
        >
          <span>Create Seller Account</span>
          <svg
            class="w-5 h-5"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 12h14"></path>
            <path d="m12 5 7 7-7 7"></path>
          </svg>
        </button>

        <p class="text-center text-sm text-gray-500 mt-6">
          Already have an account?
          <a
            href="#"
            class="text-gray-900 font-medium underline hover:opacity-70 transition"
            >Sign in</a
          >
        </p>
      </form>
    </div>
  </div>
</div>
{%endblock%}
