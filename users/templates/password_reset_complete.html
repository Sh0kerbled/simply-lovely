{% extends 'base.html' %} {% block title %}Password Changed — Simply Lovely{%endblock %} {% block content %}
<div
  class="min-h-screen flex items-center justify-center px-4 py-16"
  style="background: linear-gradient(to bottom, var(--bg-subtle), var(--bg))"
>
  <div class="w-full max-w-sm text-center">
    <div
      class="w-16 h-16 mx-auto mb-6 rounded-full flex items-center justify-center"
      style="
        background: color-mix(in srgb, #22c55e 12%, var(--bg));
        border: 1px solid color-mix(in srgb, #22c55e 25%, var(--border));
      "
    >
      <svg
        class="w-8 h-8"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#22c55e"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21.801 10A10 10 0 1 1 17 3.335" />
        <path d="m9 11 3 3 8-8" />
      </svg>
    </div>

    <h1 class="text-2xl font-bold tracking-tight theme-text mb-3">
      Password changed!
    </h1>
    <p class="text-sm theme-muted mb-8">
      Your password has been updated successfully.<br />You can now sign in with
      your new password.
    </p>

    <a
      href="{% url 'users:auth_page' %}"
      class="inline-flex items-center gap-2 px-6 py-2.5 rounded-lg text-sm font-medium transition-opacity"
      style="background: var(--text); color: var(--bg)"
      onmouseover="this.style.opacity = '.88'"
      onmouseout="this.style.opacity = '1'"
    >
      Sign in to your account
      <svg
        class="w-4 h-4"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </svg>
    </a>
  </div>
</div>
{% endblock %}
